name: Release

# Tag a commit and this cuts the zip and attaches it to a GitHub release.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag should match ## Version: in the .toc. The packager reads the .toc for
# the version and the supported game versions, and CHANGELOG.md for the notes,
# so nothing here needs editing per release.
#
# CurseForge uploads are off until two things exist: a CF_API_KEY repository
# secret, and a ## X-Curse-Project-ID: line in the .toc. The packager skips
# CurseForge silently while either is missing, so this is safe to run before
# the project has been approved.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the packager builds its changelog from history, so it needs all of it
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@master
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
