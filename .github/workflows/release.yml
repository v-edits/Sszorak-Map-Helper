name: Release

# Tag a commit and this cuts the zip and attaches it to a GitHub release.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag should match ## Version: in the .toc. The packager reads the .toc for
# the version and the supported game versions, and CHANGELOG.md for the notes,
# so nothing here needs editing per release.
#
# Each upload target needs two things: its secret passed through below, and its
# id in the .toc (## X-Curse-Project-ID: and ## X-Wago-ID:). The packager skips
# a target silently when either is missing, which is safe but quiet - if a
# release does not show up somewhere, check both halves are present.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the packager builds its changelog from history, so it needs all of it
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@master
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
